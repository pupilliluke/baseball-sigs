# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Rules go out before the client that depends on them. They stay
      # backward compatible (new fields are optional), so deploying them
      # ahead of the bundle is always safe, while the reverse order would
      # briefly reject writes the new client makes.
      #
      # Rules only: the deploy account holds firebaserules.admin, and index
      # changes need datastore.indexAdmin on top of it. Indexes are rare and
      # do not gate writes, so they stay a manual step:
      #   npx firebase-tools deploy --only firestore:indexes
      - name: Deploy Firestore rules
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only firestore:rules --project baseball-sigs --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASEBALL_SIGS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASEBALL_SIGS }}
          channelId: live
          projectId: baseball-sigs
